name = "fleet-ledger-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Comma-separated list of origins allowed to call this API — the frontend is
# deployed to GitHub Pages, Cloudflare Workers (fleetapp, and its custom
# domain smt.oneuptech.co), and (via Capacitor) the iOS and Android apps,
# which serve their bundled web content from fixed origins regardless of device.
# fleet.oneuptech.co now serves the separate FleetAppDemo and is deliberately
# not listed: the demo has its own API and must never call this one.
[vars]
ALLOWED_ORIGIN = "https://smkrmuthu.github.io,https://fleetapp.smkrmuthu.workers.dev,https://smt.oneuptech.co,capacitor://localhost,https://localhost,http://localhost:5180"

# Nightly backup at 21:00 UTC (02:30 IST) — see src/lib/backup.ts
[triggers]
crons = ["0 21 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fleet-ledger-db"
database_id = "63109d18-28d1-4331-911d-a34ee5e3f48c"

[[r2_buckets]]
binding = "DOCS"
bucket_name = "fleet-ledger-docs"

# JWT_SECRET is NOT set here — it's a secret, set once via:
#   npx wrangler secret put JWT_SECRET
# (run from this worker/ directory, after `wrangler login`)
